name: Generate GitHub contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rachelsigao
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit updated snake
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg"
          message: "chore: update contribution snake"
