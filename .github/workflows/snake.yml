# Generate GitHub contribution snake visualization
name: Generate GitHub contribution snake

# Trigger on daily schedule (00:00 UTC) or manual dispatch
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Grant write permission for committing changes
permissions:
  contents: write

# Jobs to generate and commit snake artifact
jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate contribution snake SVG from GitHub activity
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: rachelsigao
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fetch GitHub contribution total
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions}}}}","variables":{"login":"rachelsigao"}}' \
            https://api.github.com/graphql)
          total=$(echo "$response" | jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          test "$total" != "null"
          printf '{"totalContributions":%s,"updatedAt":"%s"}\n' "$total" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > output/github-stats.json

      # Commit and push updated snake visualization
      - name: Commit updated snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update GitHub contribution snake"
          add: "output/*.svg output/github-stats.json"
