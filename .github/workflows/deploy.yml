# GitHub Actions workflow to deploy portfolio to GitHub Pages
name: Deploy portfolio to GitHub Pages

# Trigger deployment on push to main branch or manual workflow dispatch
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

# Job to build and deploy
jobs:
  deploy:
    # Set GitHub Pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # Check out repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Configure GitHub Pages settings
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fetch GitHub contribution total
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions}}}}","variables":{"login":"rachelsigao"}}' \
            https://api.github.com/graphql)
          total=$(echo "$response" | jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          test "$total" != "null"
          mkdir -p output
          printf '{"totalContributions":%s,"updatedAt":"%s"}\n' "$total" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > output/github-stats.json

      # Upload built website as artifact
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # Deploy artifact to GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
